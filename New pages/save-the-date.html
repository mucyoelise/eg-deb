<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egide &amp; Deborah — Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ivory:#FBF5EE;
    --ivory-deep:#F3EBDF;
    --forest:#33473A;
    --forest-deep:#22301F;
    --rose:#C98A93;
    --blush:#EAD3CE;
    --gold:#B98D4B;
    --wine:#6B2D3C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:48px 16px;
    background:var(--ivory-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Jost',sans-serif;
  }
  .card{
    position:relative;
    width:100%;
    max-width:480px;
    background:var(--ivory);
    border:1px solid rgba(51,71,58,0.18);
    padding:56px 40px 44px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(34,48,31,0.08);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid rgba(185,141,74,0.45);
    pointer-events:none;
  }
  .florals{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .content{
    position:relative;
    text-align:center;
    z-index:2;
  }
  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--forest);
    margin:0 0 22px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    display:inline-block;
    width:22px;
    height:1px;
    background:var(--gold);
    vertical-align:middle;
    margin:0 10px 3px;
  }
  .names{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    color:var(--forest-deep);
    line-height:1.05;
    margin:0;
  }
  .names .first{
    display:block;
    font-size:clamp(30px,7vw,40px);
    letter-spacing:0.01em;
  }
  .amp{
    display:block;
    font-style:italic;
    font-weight:400;
    color:var(--rose);
    font-size:clamp(26px,6vw,34px);
    margin:6px 0;
  }
  .date-line{
    margin:26px 0 6px;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:clamp(22px,5.2vw,28px);
    color:var(--wine);
    letter-spacing:0.02em;
  }
  .venue-line{
    margin:0 0 30px;
    font-size:14px;
    letter-spacing:0.06em;
    color:var(--forest);
  }
  .divider{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:0 auto 28px;
  }
  .note{
    font-size:13px;
    line-height:1.7;
    color:#5C6B5F;
    max-width:320px;
    margin:0 auto 32px;
  }
  .details-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  #qrcode{
    padding:10px;
    background:#fff;
    border:1px solid rgba(51,71,58,0.18);
    line-height:0;
  }
  .qr-caption{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--forest);
    margin:0;
  }
  .btn{
    display:inline-block;
    margin-top:4px;
    padding:13px 34px;
    background:var(--forest);
    color:var(--ivory);
    text-decoration:none;
    font-family:'Jost',sans-serif;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    border:1px solid var(--forest);
    transition:background 0.2s ease,color 0.2s ease;
  }
  .btn:hover{
    background:var(--ivory);
    color:var(--forest);
  }
  .btn:focus-visible{
    outline:2px solid var(--wine);
    outline-offset:3px;
  }
  @media (max-width:380px){
    .card{padding:44px 24px 36px;}
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="florals" viewBox="0 0 480 640" preserveAspectRatio="none" aria-hidden="true">
      <g transform="translate(6,4) rotate(18)">
        <path d="M0,0 C40,10 70,40 82,90 C90,128 84,168 68,204" fill="none" stroke="#6E8E77" stroke-width="2"/>
        <g fill="#5E7C67">
          <path d="M6,10 C22,-2 30,-24 22,-46 C10,-30 4,-14 6,10 Z"/>
          <path d="M22,34 C42,26 56,8 56,-16 C36,-12 24,4 22,34 Z"/>
          <path d="M40,60 C62,58 80,44 84,20 C62,20 46,36 40,60 Z"/>
          <path d="M52,92 C74,96 94,86 104,64 C82,60 62,70 52,92 Z"/>
          <path d="M60,128 C82,136 104,130 116,110 C96,102 74,108 60,128 Z"/>
        </g>
        <g transform="translate(30,-10)">
          <circle r="6" fill="#B98D4B"/>
          <g fill="#D9A6AC">
            <ellipse cx="0" cy="-11" rx="5" ry="8"/>
            <ellipse cx="0" cy="11" rx="5" ry="8"/>
            <ellipse cx="-11" cy="0" rx="8" ry="5"/>
            <ellipse cx="11" cy="0" rx="8" ry="5"/>
            <ellipse cx="-8" cy="-8" rx="6" ry="6" transform="rotate(45 -8 -8)"/>
          </g>
          <circle r="3" fill="#8C6432"/>
        </g>
        <g transform="translate(78,86)">
          <circle r="4.5" fill="#B98D4B"/>
          <g fill="#C98A93">
            <ellipse cx="0" cy="-8" rx="4" ry="6"/>
            <ellipse cx="0" cy="8" rx="4" ry="6"/>
            <ellipse cx="-8" cy="0" rx="6" ry="4"/>
            <ellipse cx="8" cy="0" rx="6" ry="4"/>
          </g>
        </g>
      </g>
      <g transform="translate(474,636) rotate(198)">
        <path d="M0,0 C34,8 58,32 66,70 C72,100 66,130 54,158" fill="none" stroke="#6E8E77" stroke-width="1.6"/>
        <g fill="#5E7C67">
          <path d="M5,8 C18,-2 24,-19 18,-36 C8,-24 3,-11 5,8 Z"/>
          <path d="M18,26 C34,20 45,6 45,-13 C29,-9 19,3 18,26 Z"/>
          <path d="M32,48 C50,46 64,35 67,16 C50,16 37,29 32,48 Z"/>
          <path d="M42,74 C60,78 76,70 84,52 C66,49 50,57 42,74 Z"/>
        </g>
        <g transform="translate(24,-4)">
          <circle r="4.5" fill="#B98D4B"/>
          <g fill="#D9A6AC">
            <ellipse cx="0" cy="-8" rx="4" ry="6"/>
            <ellipse cx="0" cy="8" rx="4" ry="6"/>
            <ellipse cx="-8" cy="0" rx="6" ry="4"/>
            <ellipse cx="8" cy="0" rx="6" ry="4"/>
          </g>
        </g>
      </g>
    </svg>

    <div class="content">
      <p class="eyebrow">Save the date</p>
      <p class="names">
        <span class="first">Kwizera Egide</span>
        <span class="amp">&amp;</span>
        <span class="first">Umutesi Deborah</span>
      </p>
      <p class="date-line">Monday, 1st February 2027</p>
      <p class="venue-line">Dove Hotel &nbsp;·&nbsp; Gisozi, Kigali</p>
      <div class="divider"></div>
      <p class="note">We are getting married, and we would love for you to be part of our day. Full details, schedule and RSVP are just a scan away.</p>

      <div class="details-block">
        <div id="qrcode"></div>
        <p class="qr-caption">Scan for full details</p>
        <a class="btn" href="https://egide-deborah.teclk.com" target="_blank" rel="noopener">View full details</a>
      </div>
    </div>
  </div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://egide-deborah.teclk.com",
    width: 132,
    height: 132,
    colorDark: "#33473A",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
