<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egide &amp; Deborah — Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&family=Alex+Brush&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ivory:#F8F4EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:48px 16px;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Jost',sans-serif;
  }
  .card{
    position:relative;
    width:100%;
    max-width:460px;
    aspect-ratio:3/4.3;
    overflow:hidden;
    color:var(--ivory);
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.16), transparent 55%),
      radial-gradient(circle at 30% 78%, rgba(50,45,40,0.9), transparent 60%),
      linear-gradient(155deg, #3a352f 0%, #221f1c 45%, #16140f 100%);
  }
  .grain{
    position:absolute;
    inset:0;
    opacity:0.35;
    mix-blend-mode:overlay;
  }
  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 40%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  .content{
    position:relative;
    z-index:3;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:44px 28px 34px;
    text-align:center;
  }
  .script{
    font-family:'Alex Brush',cursive;
    font-size:clamp(52px,13vw,72px);
    line-height:1;
    margin:0 0 10px;
    color:var(--ivory);
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
  }
  .names{
    font-family:'Jost',sans-serif;
    font-weight:400;
    font-size:clamp(15px,4vw,18px);
    letter-spacing:0.34em;
    margin:0;
    text-transform:uppercase;
    text-shadow:0 1px 10px rgba(0,0,0,0.4);
  }
  .spacer{flex:1;}
  .date-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    width:100%;
  }
  .date-line{
    flex:1;
    height:1px;
    background:rgba(248,244,236,0.65);
    max-width:70px;
  }
  .month{
    font-size:14px;
    letter-spacing:0.3em;
    font-weight:400;
  }
  .day{
    font-family:serif;
    font-weight:500;
    font-size:clamp(70px,20vw,96px);
    line-height:0.9;
    padding:0 6px;
    text-shadow:0 3px 20px rgba(0,0,0,0.4);
  }
  .year{
    font-size:14px;
    letter-spacing:0.3em;
    font-weight:400;
  }
  .venue-line{
    margin:18px 0 0;
    font-size:12px;
    letter-spacing:0.16em;
    color:rgba(248,244,236,0.85);
  }
  .lower-divider{
    width:56px;
    height:1px;
    background:rgba(248,244,236,0.45);
    margin:26px 0 20px;
  }
  .details-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  #qrcode{
    padding:8px;
    background:#fff;
    line-height:0;
  }
  .qr-caption{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:rgba(248,244,236,0.8);
    margin:0;
  }
  .btn{
    display:inline-block;
    margin-top:2px;
    padding:11px 30px;
    background:transparent;
    color:var(--ivory);
    text-decoration:none;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    border:1px solid rgba(248,244,236,0.7);
    transition:background 0.2s ease,color 0.2s ease;
  }
  .btn:hover{
    background:var(--ivory);
    color:#221f1c;
  }
  .btn:focus-visible{
    outline:2px solid var(--ivory);
    outline-offset:3px;
  }
  .swap-note{
    max-width:460px;
    margin:16px auto 0;
    text-align:center;
    font-size:12px;
    color:#8a8a8a;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="grain" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true">
      <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <div class="vignette"></div>

    <div class="content">
      <p class="script">Save the Date</p>
      <p class="names">Egide &amp; Deborah</p>

      <div class="spacer"></div>

      <div class="date-row">
        <span class="date-line"></span>
        <span class="month">FEB</span>
        <span class="day">01</span>
        <span class="year">2027</span>
        <span class="date-line"></span>
      </div>
      <p class="venue-line">Come and join us as we celebrate...</p>

      <div class="lower-divider"></div>

      <div class="details-block">
        <div id="qrcode"></div>
        <p class="qr-caption">Scan for full details</p>
        <a class="btn" href="https://egide-deborah.teclk.com" target="_blank" rel="noopener">View full details</a>
      </div>
    </div>
  </div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://egide-deborah.teclk.com",
    width: 110,
    height: 110,
    colorDark: "#221f1c",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
